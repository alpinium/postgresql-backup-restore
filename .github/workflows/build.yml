name: Build images

# PR          - build + smoke test (amd64 and arm64), no push
# push main   - build + push all combinations from configuration.yaml as multi-arch images
# manual      - rebuild (e.g. to pick up Debian security updates)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

# Images are pushed to GHCR (GitHub organization) and to Docker Hub (organization alpiniumtech).
# Docker Hub login uses repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/alpiniumtech/${{ github.event.repository.name }}
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  matrix:
    name: Load matrix
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.load.outputs.targets }}
      include: ${{ steps.load.outputs.include }}
      platforms: ${{ steps.load.outputs.platforms }}
      created: ${{ steps.load.outputs.created }}
    steps:
      - uses: actions/checkout@v7

      # PostgreSQL client × Debian combinations from configuration.yaml:
      #   postgresql_versions.<major>.postgresql.<debian>.version  - exact package (postgresql-client-<major>=X.Y-Z)
      #   postgresql_versions.<major>.debian                       - list of Debian releases to build on
      # Each combination is built natively for every platform in PLATFORMS
      # and the results are then merged into a single multi-arch manifest.
      - name: Load matrix from configuration.yaml
        id: load
        run: |
          PLATFORMS='[
            {"platform": "linux/amd64", "arch": "amd64", "runner": "ubuntu-24.04"},
            {"platform": "linux/arm64", "arch": "arm64", "runner": "ubuntu-24.04-arm"}
          ]'

          CONFIG=$(yq -o=json configuration.yaml)

          INVALID=$(echo "$CONFIG" | jq -r '
            .postgresql_versions | to_entries[]
            | .key as $POSTGRESQL
            | .value.postgresql as $PACKAGES
            | .value.debian[]
            | . as $DEBIAN
            | ($PACKAGES[$DEBIAN].version // "" | tostring) as $PACKAGE
            | if $PACKAGE == "" then "\($POSTGRESQL)/\($DEBIAN): missing postgresql.\($DEBIAN).version"
              elif ($PACKAGE | test("^postgresql-client-" + $POSTGRESQL + "=" + $POSTGRESQL + "\\.[0-9]+-")) | not
              then "\($POSTGRESQL)/\($DEBIAN): invalid package \"\($PACKAGE)\""
              else empty end')
          if [ -n "$INVALID" ]; then
            echo "$INVALID"
            exit 1
          fi

          TARGETS=$(echo "$CONFIG" | jq -c '[
            .postgresql_versions | to_entries[]
            | .key as $POSTGRESQL
            | .value.postgresql as $PACKAGES
            | .value.debian[]
            | {
                postgresql: $POSTGRESQL,
                version: ($PACKAGES[.].version | sub("^[^=]*="; "") | sub("-.*$"; "")),
                debian: .
              }
          ]')

          if [ "$(echo "$TARGETS" | jq 'length')" -eq 0 ]; then
            echo "configuration.yaml does not contain any PostgreSQL client × Debian combination"
            exit 1
          fi

          INCLUDE=$(jq -nc --argjson TARGETS "$TARGETS" --argjson PLATFORMS "$PLATFORMS" \
            '[$TARGETS[] as $T | $PLATFORMS[] | $T + .]')

          {
            echo "targets=${TARGETS}"
            echo "include=${INCLUDE}"
            echo "platforms=$(echo "$PLATFORMS" | jq -c '[.[].platform]')"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "$INCLUDE" | jq -r '.[] | "PostgreSQL client \(.version) / Debian \(.debian) / \(.arch)"'

  build:
    name: PostgreSQL client ${{ matrix.version }} / Debian ${{ matrix.debian }} / ${{ matrix.arch }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Compute image names
        id: meta
        run: |
          GHCR_IMAGE="${GHCR_IMAGE,,}"            # registries require lowercase
          DOCKERHUB_IMAGE="${DOCKERHUB_IMAGE,,}"
          echo "IMAGES=${GHCR_IMAGE},${DOCKERHUB_IMAGE}" >> "$GITHUB_OUTPUT"

      # Image labels come from labels_script.sh (shared with debug_script.sh).
      # The Debian point release is read from the base image,
      # the smoke test checks that it matches the built image
      - name: Compute labels
        id: labels
        env:
          POSTGRESQL_VERSION: ${{ matrix.version }}
          POSTGRESQL_MAJOR: ${{ matrix.postgresql }}
          DEBIAN_CODENAME: ${{ matrix.debian }}
          VCS_REF: ${{ github.sha }}
          BUILD_DATE: ${{ needs.matrix.outputs.created }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          DEBIAN_POINT_RELEASE=$(docker run --rm --pull always --platform "${{ matrix.platform }}" "debian:${DEBIAN_CODENAME}-slim" cat /etc/debian_version)
          export DEBIAN_POINT_RELEASE
          {
            echo 'LABELS<<LABELS_EOF'
            bash ./labels_script.sh
            echo 'LABELS_EOF'
          } >> "$GITHUB_OUTPUT"

      # The POSTGRESQL_VERSION build argument is the major version,
      # install_script.sh uses it to look up the exact package in configuration.yaml
      - name: Build (${{ matrix.arch }}, for test)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: test-image
          build-args: |
            DEBIAN_CODENAME=${{ matrix.debian }}
            POSTGRESQL_VERSION=${{ matrix.postgresql }}
          labels: ${{ steps.labels.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.version }}-${{ matrix.debian }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.version }}-${{ matrix.debian }}-${{ matrix.arch }}

      - name: Smoke test
        run: |
          POSTGRESQL_BIN="/usr/lib/postgresql/${{ matrix.postgresql }}/bin"
          docker run --rm test-image "${POSTGRESQL_BIN}/pg_dump" --version | grep -F " ${{ matrix.version }} "
          docker run --rm test-image "${POSTGRESQL_BIN}/pg_restore" --version | grep -F " ${{ matrix.version }} "
          docker run --rm test-image "${POSTGRESQL_BIN}/psql" --version | grep -F " ${{ matrix.version }} "
          docker run --rm test-image sh -c 'echo smoke-test | zstd -19 --long=27 | zstd -dc | grep -qxF smoke-test'
          docker run --rm test-image grep -q "VERSION_CODENAME=${{ matrix.debian }}" /etc/os-release
          docker run --rm test-image dpkg --print-architecture | grep -qx "${{ matrix.arch }}"
          DEBIAN_POINT_RELEASE=$(docker run --rm test-image cat /etc/debian_version)
          docker inspect --format '{{ index .Config.Labels "debian.point-release" }}' test-image | grep -qxF "$DEBIAN_POINT_RELEASE"

      - name: Login to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The single-platform image is pushed by digest only (untagged) to both registries,
      # tags are applied to the multi-arch manifest in the "merge" job
      - name: Push by digest (${{ matrix.arch }})
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ steps.meta.outputs.images }}",push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          build-args: |
            DEBIAN_CODENAME=${{ matrix.debian }}
            POSTGRESQL_VERSION=${{ matrix.postgresql }}
          labels: ${{ steps.labels.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.version }}-${{ matrix.debian }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.version }}-${{ matrix.debian }}-${{ matrix.arch }}

      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          DIGEST="${{ steps.push.outputs.digest }}"
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.version }}-${{ matrix.debian }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Manifest PostgreSQL client ${{ matrix.version }} / Debian ${{ matrix.debian }}
    needs: [matrix, build]
    # Runs even if some combinations failed - the rest are published,
    # incomplete ones (missing a platform) fail below
    if: ${{ !cancelled() && needs.matrix.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.targets) }}

    steps:
      - uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.version }}-${{ matrix.debian }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Image tags for commit a1b2c3d (PostgreSQL client 18.6, trixie), in both registries:
      #   18.6-trixie-a1b2c3d - specific commit
      #   18.6-trixie         - latest build of the given PostgreSQL client version
      #   18-trixie           - latest PostgreSQL client version of the major release
      - name: Compute image tags
        id: meta
        run: |
          GHCR_IMAGE="${GHCR_IMAGE,,}"            # registries require lowercase
          DOCKERHUB_IMAGE="${DOCKERHUB_IMAGE,,}"
          SHA="${GITHUB_SHA::7}"
          FULL="${{ matrix.version }}-${{ matrix.debian }}"
          MAJOR="${{ matrix.postgresql }}-${{ matrix.debian }}"
          TAGS=()
          for IMAGE in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            TAGS+=("${IMAGE}:${FULL}-${SHA}" "${IMAGE}:${FULL}" "${IMAGE}:${MAJOR}")
          done
          {
            echo "SOURCE_IMAGE=${GHCR_IMAGE}"
            echo "TAGS=$(IFS=','; echo "${TAGS[*]}")"
          } >> "$GITHUB_OUTPUT"

      # Index annotations use the same labels_script.sh as the images,
      # the Debian point release is read from the label of a pushed platform image
      - name: Create multi-arch manifest
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          POSTGRESQL_VERSION: ${{ matrix.version }}
          POSTGRESQL_MAJOR: ${{ matrix.postgresql }}
          DEBIAN_CODENAME: ${{ matrix.debian }}
          VCS_REF: ${{ github.sha }}
          BUILD_DATE: ${{ needs.matrix.outputs.created }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          SOURCE_IMAGE="${{ steps.meta.outputs.source_image }}"
          EXPECTED=$(echo '${{ needs.matrix.outputs.platforms }}' | jq 'length')
          FOUND=$(find . -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$FOUND" -ne "$EXPECTED" ]; then
            echo "Found ${FOUND} of ${EXPECTED} platforms, manifest will not be created"
            exit 1
          fi

          TAG_ARGS=()
          for TAG in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' ' '); do
            TAG_ARGS+=(-t "$TAG")
          done

          SOURCES=()
          for DIGEST in *; do
            SOURCES+=("${SOURCE_IMAGE}@sha256:${DIGEST}")
          done

          DEBIAN_POINT_RELEASE=$(docker buildx imagetools inspect "${SOURCES[0]}" \
            --format '{{ index .Image.Config.Labels "debian.point-release" }}')
          export DEBIAN_POINT_RELEASE
          LABELS=$(bash "${GITHUB_WORKSPACE}/labels_script.sh")
          ANNOTATION_ARGS=()
          while read -r LABEL; do
            ANNOTATION_ARGS+=(--annotation "index:${LABEL}")
          done <<< "$LABELS"

          docker buildx imagetools create "${TAG_ARGS[@]}" "${ANNOTATION_ARGS[@]}" "${SOURCES[@]}"

          FIRST_TAG="${TAG_ARGS[1]}"
          docker buildx imagetools inspect "$FIRST_TAG"
          DIGEST=$(docker buildx imagetools inspect "$FIRST_TAG" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "DIGEST=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          # Backticks in sed are Markdown code spans, not command substitution
          # shellcheck disable=SC2016
          {
            echo "### PostgreSQL client ${{ matrix.version }} / Debian ${{ matrix.debian }}"
            echo
            echo "- commit: \`${{ github.sha }}\`"
            echo "- digest: \`${{ steps.manifest.outputs.digest }}\`"
            echo "- platforms: \`$(echo '${{ needs.matrix.outputs.platforms }}' | jq -r 'join(", ")')\`"
            echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | sed 's/.*/- `&`/'
          } >> "$GITHUB_STEP_SUMMARY"
